plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.compose'
    id 'org.jetbrains.kotlin.plugin.compose'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation project(':shared')
    implementation compose.desktop.currentOs
    implementation compose.material3
    implementation compose.materialIconsExtended
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-swing:1.10.2'
    implementation 'net.java.dev.jna:jna:5.14.0'
    // JBR 的 `com.jetbrains.WindowDecorations` 接口。
    // 用 `implementation` 而不是 `compileOnly`：这个 jar 里的 `com.jetbrains.JBR` 是**桥接类**，
    // 运行时负责把调用转交给 JBR 内部的实现（`JBRApiBootstrap` + 动态代理）。
    // 只放编译期会在启动时报 `NoClassDefFoundError: com/jetbrains/JBR`（实测）。
    // 体积 < 100 KB，可忽略。
    implementation 'org.jetbrains.runtime:jbr-api:1.10.1'
    // FlatLaf：仅用于统一系统标题栏模式下的外观（DWM 非客户区 / 圆角）。
    implementation 'com.formdev:flatlaf:3.6.1'
    implementation 'io.coil-kt.coil3:coil-compose:3.1.0'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.1.0'
    testImplementation 'junit:junit:4.13.2'
}

compose.desktop {
    application {
        mainClass = 'ceui.pixshaft.desktop.MainKt'
        // Groovy cannot see Kotlin Property `isEnabled` (JavaBean `is*` clash).
        // Keep ProGuard on for release, but ignore OkHttp/Retrofit optional Android types.
        buildTypes.release.proguard {
            configurationFiles.from(project.file('proguard-rules.pro'))
        }
        nativeDistributions {
            targetFormats(
                    org.jetbrains.compose.desktop.application.dsl.TargetFormat.Msi,
                    org.jetbrains.compose.desktop.application.dsl.TargetFormat.Exe,
            )
            packageName = 'PixShaft-Win'
            packageVersion = '0.0.5'
            description = 'Unofficial Pixiv client for Windows (Pixiv-Shaft-Win)'
            vendor = 'Pixiv-Shaft-Win'
            copyright = 'GNU GPL v2. Copyright (C) Pixiv-Shaft contributors.'
            licenseFile.set(rootProject.file('LICENSE'))
            includeAllModules = false
            modules('jdk.unsupported', 'jdk.unsupported.desktop')
            windows {
                menuGroup = 'PixShaft'
                upgradeUuid = '8c2e1d4a-6b7f-4c91-9e3a-2f7b14d9a001'
                shortcut = true
                dirChooser = true
                iconFile.set(project.file('icon.ico'))
            }
            appResourcesRootDir.set(project.layout.projectDirectory.dir('distribute'))
        }
        jvmArgs.add('-Xmx1g')
        jvmArgs.add('-Djava.protocol.handler.pkgs=ceui.pixshaft.desktop.protocol')
    }
}

tasks.register('packageReleasePortableZip', Zip) {
    dependsOn tasks.named('createReleaseDistributable')
    group = 'compose desktop'
    description = 'Zip the release app-image with a PixShaft.portable marker.'
    archiveFileName = 'PixShaft-Win-0.0.5-portable.zip'
    destinationDirectory = layout.buildDirectory.dir('compose/binaries/main-release/zip')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(layout.buildDirectory.dir('compose/binaries/main-release/app/PixShaft-Win')) {
        into 'PixShaft-Win'
    }
    from {
        def marker = layout.buildDirectory.file('tmp/PixShaft.portable').get().asFile
        marker.parentFile.mkdirs()
        marker.text = 'portable\n'
        marker
    } {
        into 'PixShaft-Win'
    }
}

def webAuthOutDir = layout.buildDirectory.dir('webauth')

tasks.register('publishWebAuthHost', Exec) {
    group = 'compose desktop'
    description = 'Publish Pixeval-style WebView2 login helper as a standalone exe (not packed into the app image).'
    workingDir = file('webview-auth')
    commandLine 'dotnet', 'publish', '-c', 'Release', '-r', 'win-x64', '--self-contained', 'true',
            '/p:PublishSingleFile=true',
            '/p:IncludeNativeLibrariesForSelfExtract=true',
            '-o', webAuthOutDir.get().asFile.absolutePath
}

tasks.register('packageWebAuthHost', Copy) {
    dependsOn 'publishWebAuthHost'
    group = 'compose desktop'
    description = 'Copy standalone PixShaftWebAuth.exe next to MSI/EXE/zip for separate GitHub upload.'
    from(webAuthOutDir) {
        include 'PixShaftWebAuth.exe'
    }
    into layout.buildDirectory.dir('compose/binaries/main-release/webauth')
}

afterEvaluate {
    tasks.withType(JavaExec).configureEach {
        if (name == 'run' || name == 'runRelease') {
            dependsOn 'publishWebAuthHost'
            systemProperty 'pixshaft.webauth', new File(webAuthOutDir.get().asFile, 'PixShaftWebAuth.exe').absolutePath
        }
    }
    // Do NOT copy PixShaftWebAuth.exe into the app image / portable root.
    // It is published as its own release asset and downloaded on demand.
    tasks.matching { it.name == 'packageReleaseDistributionForCurrentOS' }.configureEach {
        finalizedBy('packageReleasePortableZip', 'packageWebAuthHost')
    }
}