# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
android.enableJetifier=true
android.useAndroidX=true
# R8 full-mode + optimized resource shrinking needs materially more headroom than dex-only builds.
# 1.5 GiB caused GC thrashing on the release graph; cap both heaps so local/CI builds stay stable.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
android.injected.testOnly=false
org.gradle.warning.mode=all
# AGP 8.7 opt-in: let R8 analyze code and resources as one reachability graph.
android.r8.optimizedResourceShrinking=true
# 本机 JDK 探测路径。原来写死的是 macOS 路径（/Users/neojenkins/...），在 Windows 上会让
# Gradle 报 Cannot convert relative path \Users\neojenkins\...。这里指向本机 JDK 与 JBR。
org.gradle.java.installations.paths=C:/Users/kk/.jdks/jdk-17.0.2,C:/Users/kk/.jdks/jbr-17.0.14-windows-x64-b1367.22
